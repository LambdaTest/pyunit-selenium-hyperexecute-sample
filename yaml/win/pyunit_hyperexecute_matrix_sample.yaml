---
version: 0.1

runtime:
  language: python
  version: "3.11"

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: win

retryOnFailure: true
maxRetries: 1

matrix:
  files:
    - "tests/lt_sample_todo.py"
    - "tests/lt_selenium_playground.py"

env:
  TARGET_OS: Windows 11

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - CacheDir

pre:
  - python --version
  - pip --version
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt --cache-dir CacheDir

post:
  - type yaml\win\pyunit_hyperexecute_matrix_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: TestReport
    path:
      - example_*/**

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testSuites:
  - python $files

jobLabel:
  - selenium-pyunit
  - win
  - matrix