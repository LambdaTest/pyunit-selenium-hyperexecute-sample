---
version: 0.1

runtime:
  language: python
  version: "3.11"

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: ${matrix.os}

retryOnFailure: false
autosplit: true
maxRetries: 1
parallelism: 1
concurrency: 3

matrix:
  os:
    - mac
    - win
    - linux

env:
  TARGET_OS: ${matrix.os}

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - CacheDir

pre:
  - python --version
  - python -m pip --version
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt --cache-dir CacheDir

post:
  - echo "Post execution completed."

mergeArtifacts: true

uploadArtefacts:
  - name: TestReport
    path:
      - example_*/**

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: grep -nri 'HyperTestPyUnit' tests -ir --include=\*.py | sed 's/:.*//'

testRunnerCommand: python $test

jobLabel:
  - selenium-pyunit
  - hybrid